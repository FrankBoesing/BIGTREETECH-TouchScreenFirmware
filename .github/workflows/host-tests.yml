name: Host tests

on:
  push:
    branches:
      - bugfix
  pull_request:
    branches:
      - bugfix
  workflow_dispatch:

jobs:
  gcode-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile G-code parser tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -I TFT/src/User/API \
            tests/host/test_gcode_parser.c \
            -o /tmp/test_gcode_parser

      - name: Run G-code parser tests
        run: /tmp/test_gcode_parser
